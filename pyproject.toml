[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cenfuse"
version = "0.8.0"
description = "Centromeres from satellite arrays, LTR retrotransposons, Hi-C and methylation, cross-validated and co-localized"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "pysam", "pyhmmer>=0.12", "pyabpoa>=1.5", "matplotlib", "h5py"]

[project.scripts]
cenfuse = "cenfuse.cli:main"

[tool.setuptools.packages.find]
include = ["cenfuse*"]

[tool.setuptools.package-data]
"cenfuse.sat" = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
