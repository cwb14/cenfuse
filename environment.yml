# mamba env create -f environment.yml && mamba activate cenfuse && pip install --no-deps .
# Versions as in cenfuse 0.14.0's benchmark (major.minor pinned); the exact linux-64 environment: environment.lock.txt.
# Each run records what it actually used in OUT/run_info.json.
name: cenfuse
channels: [conda-forge, bioconda]
dependencies:
  - python=3.10
  - numpy=2.2
  - scipy=1.15
  - pandas=2.3
  - pysam=0.24
  - pyhmmer=0.12
  - pyabpoa=1.5.7
  - matplotlib=3.10
  - h5py=3.16
  - pytest
  - pytest-xdist
  # satellite engine (cenfuse.sat)
  - fastan=0.8                # default seed engine; fastga gives FAtoGDB, ONEview
  - fastga=1.5.20260729
  - trf=4.10.0rc2             # alternative seed engine (--seed-engine trf)
  - blast=2.17
  - mafft=7.525
  - cd-hit=4.8.1
  - infernal=1.1.5
  - minimap2=2.31             # long-unit tandems; Hi-C mis-mapping null (cenfuse.hic simulate)
  - samtools=1.24
  - htslib=1.24               # tabix/bgzip for bedMethyl
